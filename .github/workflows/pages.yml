name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify browser runtime
        run: |
          for file in data.js logic_func.js ui_shell.js motion.js interface.js animation.js main.js; do
            test -f "dist/$file"
          done
          if grep -Eq '(href|src)="/assets/' dist/index.html; then
            echo "Pages build contains root-relative Vite assets" >&2
            exit 1
          fi
          if grep -q 'data:text/css' dist/index.html; then
            echo "Pages build contains inline CSS with ambiguous relative asset URLs" >&2
            exit 1
          fi
          for file in \
            img/system/home/background-identity.jpg \
            img/system/home/background-story-shu.jpg \
            img/system/role_bg.png; do
            test -f "dist/$file"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
